services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cv-screener-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv_screener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cv_screener']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
